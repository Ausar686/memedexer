services:
  bot:
    build:
      context: .
      dockerfile: .docker/Dockerfile
    image: memedexer:latest
    # The bot only makes outbound calls, and on hosts whose VPN or firewall doesn't pass bridged container traffic it
    # can reach Telegram only the way the host does.
    network_mode: host
    env_file: .env
    environment:
      # The database must live on the volume, whatever .env says.
      DATABASE_URL: sqlite+aiosqlite:////data/memedexer.db
    volumes:
      - data:/data
    restart: unless-stopped
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  data:
