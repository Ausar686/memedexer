[project]
name = "memedexer"
version = "0.1.0"
description = "Meme indexer for Telegram chats"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiosqlite==0.22.1",
    "alembic==1.20.0",
    "pydantic-settings==2.15.0",
    "sqlalchemy[asyncio]==2.1.1",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bandit==1.9.4",
    "coverage==7.16.1",
    "isort==9.0.1",
    "pre-commit==4.6.2",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.9",
    "semgrep==1.178.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]

[tool.isort]
profile = "black"
line_length = 120
src_paths = ["src", "tests"]
known_first_party = ["memedexer"]

[tool.coverage.run]
branch = true
source = ["memedexer"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if t.TYPE_CHECKING:",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
