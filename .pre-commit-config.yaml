repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-json
      - id: check-yaml
      - id: check-toml
      - id: debug-statements
      - id: mixed-line-ending

  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run --no-sync ruff check --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: isort
        name: isort
        entry: uv run --no-sync isort
        language: system
        types: [python]
      - id: bandit
        name: bandit
        entry: uv run --no-sync bandit -c pyproject.toml -r src --severity-level medium
        language: system
        pass_filenames: false
        always_run: true
